name: Build daily colouring pictures

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-colouring-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python generate_feed.py
      - name: Publish today's feed
        run: |
          git config user.name "daily-puzzler-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Daily colouring pictures $(date -u +%F)"
          git push
